<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>北海道旅行資料</title>
<style>
  :root{--bg:#f3f2ee;--surface:#fff;--ink:#1b2a38;--muted:#6c7681;--hair:#e4e1d9;--crab:#b23b2e;--onsen:#2f7d7a;--navy:#20405c;
    --serif:"Noto Serif TC",serif;--sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;}
  @media (prefers-color-scheme:dark){:root{--bg:#13181d;--surface:#1b222a;--ink:#e8e9e6;--muted:#9aa4ad;--hair:#2c353e;--crab:#e07a6c;--onsen:#5bb4b0;--navy:#8fb4d3;color-scheme:dark;}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased}
  .wrap{max-width:640px;margin:0 auto;padding:52px 20px 72px}
  h1{font-family:var(--serif);font-size:clamp(26px,6vw,36px);margin:0;line-height:1.15}
  .eyebrow{font-size:12px;letter-spacing:.2em;color:var(--crab);font-weight:700;margin-bottom:12px}
  .lede{color:var(--muted);font-size:14.5px;margin:12px 0 28px}
  a.card{display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:18px 20px;margin-bottom:14px;transition:transform .12s,border-color .12s}
  a.card:hover{transform:translateY(-2px);border-color:var(--onsen)}
  .ic{flex:none;width:52px;height:52px;border-radius:13px;background:var(--onsen);color:#fff;font-size:26px;display:flex;align-items:center;justify-content:center}
  .ic.c2{background:var(--navy)}.ic.c3{background:var(--crab)}
  .tt{flex:1;min-width:0}
  .tt b{font-family:var(--serif);font-size:18px;display:block}
  .tt span{font-size:12.5px;color:var(--muted)}
  .arr{color:var(--muted);font-size:20px}
  .foot{margin-top:30px;font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
  <div class="wrap">
    <div class="eyebrow">11/16–11/20 · 無時無地都能看</div>
    <h1>北海道旅行資料</h1>
    <p class="lede">雄獅星宇五日團。手機點下面任一張即可開啟；購物清單可勾選「已買／已吃」，進度存在手機瀏覽器。</p>

    <a class="card" href="list.html">
      <div class="ic">🛍</div>
      <div class="tt"><b>買 × 吃 行程清單</b><span>必買好物＋日系彩妝＋必吃，依行程排序、可勾選</span></div>
      <div class="arr">→</div>
    </a>

    <a class="card" href="itinerary.html">
      <div class="ic c2">🗓</div>
      <div class="tt"><b>五日每日時刻表</b><span>每日路線總覽、每個地點一鍵 📍Google Maps、航班、機場零食</span></div>
      <div class="arr">→</div>
    </a>

    <a class="card" href="card-rewards.html">
      <div class="ic c3">💳</div>
      <div class="tt"><b>刷卡回饋試算</b><span>中信／玉山／富邦 J卡 日本刷卡，手機直接輸入金額即時試算</span></div>
      <div class="arr">→</div>
    </a>

    <div class="foot">資料為個人行前整理，營業時間／優惠以當天官方為準。</div>
  </div>
</body>
</html>
